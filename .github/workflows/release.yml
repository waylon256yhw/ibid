name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Run tests
        run: bun test

      - name: Build multi-platform release archives
        run: bun run build:release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ibid-release-archives
          path: |
            dist/release/*.zip
            dist/release/SHASUMS256.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/*.zip dist/release/SHASUMS256.txt --clobber
          else
            gh release create "$TAG" dist/release/*.zip dist/release/SHASUMS256.txt \
              --title "ibid $TAG" \
              --generate-notes
          fi
